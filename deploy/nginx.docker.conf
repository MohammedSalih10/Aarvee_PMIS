# nginx config for docker-compose.yml (mounted as /etc/nginx/conf.d/default.conf).
# Same as nginx.conf, but the upstream is the "app" container on the compose network.
# Certificate files expected in ./certs: fullchain.pem and privkey.pem.

limit_req_zone $binary_remote_addr zone=pmis_login:10m rate=10r/m;

server {
    listen 80;
    server_name pmis.yourcompany.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pmis.yourcompany.internal;

    ssl_certificate     /etc/ssl/pmis/fullchain.pem;
    ssl_certificate_key /etc/ssl/pmis/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Uploads are capped at 25 MB per file / 10 files by the app (multer);
    # nginx's 1 MB default would reject them with 413 first.
    client_max_body_size 30m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /api/auth/login {
        limit_req zone=pmis_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://app:3000;
        include /etc/nginx/pmis-proxy.conf;
    }

    location / {
        proxy_pass http://app:3000;
        include /etc/nginx/pmis-proxy.conf;
    }
}
